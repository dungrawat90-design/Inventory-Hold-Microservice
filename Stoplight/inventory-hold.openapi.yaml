openapi: 3.0.3
info:
  title: Inventory Hold API
  version: 1.0.0
  description: |
    Temporarily reserves stock while a customer completes checkout.

    A hold moves quantity from **available** to **held**. It ends in one of three ways: it is released by the
    caller, it expires after its lifetime, or the caller lets it run out. Stock is returned exactly once.

    Every endpoint requires the `X-Api-Key` header. Errors use RFC 7807 ProblemDetails and carry a `traceId`.
servers:
  - url: http://localhost:5080
    description: Local (docker compose)
security:
  - ApiKey: []
tags:
  - name: Holds
  - name: Inventory
paths:
  /api/holds:
    post:
      tags: [Holds]
      operationId: CreateHold
      summary: Create an inventory hold
      description: |
        Reserves the requested quantity of every SKU, or none of them. Duplicate SKUs in one request are merged.
        The hold expires after `ttlMinutes` (default 15, maximum 60).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHoldRequest'
            example:
              items:
                - sku: DEMO-1001
                  quantity: 2
              ttlMinutes: 15
      responses:
        '201':
          description: The hold was created. The `Location` header points to it.
          headers:
            Location:
              schema:
                type: string
              example: /api/holds/3f2b8c1d9e4a4f7b8a6d1c2e3f405162
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hold'
        '400':
          description: The request failed validation (no items, quantity below 1, bad SKU, ttlMinutes outside 1 to 60).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: A requested SKU does not exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Not enough stock is available for at least one SKU. Nothing was reserved.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                title: Insufficient stock
                status: 409
                detail: Not enough stock available for SKU 'DEMO-1003'.
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
        '429':
          description: Too many requests.
  /api/holds/{holdId}:
    parameters:
      - name: holdId
        in: path
        required: true
        description: The `id` returned when the hold was created.
        schema:
          type: string
        example: 3f2b8c1d9e4a4f7b8a6d1c2e3f405162
    get:
      tags: [Holds]
      operationId: GetHold
      summary: Get a hold
      responses:
        '200':
          description: The hold.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hold'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No hold exists with that id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      tags: [Holds]
      operationId: ReleaseHold
      summary: Release a hold
      description: |
        Returns the held stock. Releasing a hold that is already released or expired changes nothing and returns its
        current state, so the call is safe to repeat.
      responses:
        '200':
          description: The hold in its new (or unchanged) state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hold'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No hold exists with that id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/inventory:
    get:
      tags: [Inventory]
      operationId: GetInventory
      summary: List stock
      description: Available, held and total quantity per SKU, ordered by SKU. Results are cached briefly.
      parameters:
        - name: skip
          in: query
          description: Number of SKUs to skip. Negative values are treated as 0.
          schema:
            type: integer
            minimum: 0
            default: 0
          example: 0
        - name: take
          in: query
          description: Page size. Defaults to 50 and is capped at 200.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          example: 50
      responses:
        '200':
          description: A page of stock.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
  responses:
    Unauthorized:
      description: The `X-Api-Key` header is missing or wrong.
  schemas:
    HoldItem:
      type: object
      required: [sku, quantity]
      properties:
        sku:
          type: string
          maxLength: 64
          pattern: '^[A-Za-z0-9._-]+$'
          example: DEMO-1001
        quantity:
          type: integer
          minimum: 1
          maximum: 10000
          example: 2
    CreateHoldRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/HoldItem'
        ttlMinutes:
          type: integer
          nullable: true
          minimum: 1
          maximum: 60
          description: Hold lifetime in minutes. Defaults to 15 when omitted.
          example: 15
    Hold:
      type: object
      required: [id, status, items, createdAt, expiresAt]
      properties:
        id:
          type: string
          example: 3f2b8c1d9e4a4f7b8a6d1c2e3f405162
        status:
          type: string
          enum: [Active, Released, Expired]
        items:
          type: array
          items:
            $ref: '#/components/schemas/HoldItem'
        createdAt:
          type: string
          format: date-time
          example: '2026-11-01T09:00:00Z'
        expiresAt:
          type: string
          format: date-time
          example: '2026-11-01T09:15:00Z'
        releasedAt:
          type: string
          format: date-time
          nullable: true
          description: When the hold left the Active state (released or expired). Null while active.
          example: '2026-11-01T09:05:00Z'
    InventoryItem:
      type: object
      required: [sku, available, held, total]
      properties:
        sku:
          type: string
          example: DEMO-1001
        available:
          type: integer
          example: 23
        held:
          type: integer
          example: 2
        total:
          type: integer
          description: available + held.
          example: 25
    InventoryPage:
      type: object
      required: [items, skip, take, totalCount]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InventoryItem'
        skip:
          type: integer
          example: 0
        take:
          type: integer
          example: 50
        totalCount:
          type: integer
          format: int64
          example: 5
    Problem:
      type: object
      properties:
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        traceId:
          type: string
          description: Quote this when reporting a problem; it matches the server log entry.
    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
              example:
                'Items[0].Quantity':
                  - Quantity must be between 1 and 10000.

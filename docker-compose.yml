name: inventory-hold

# One command starts everything:  docker compose up --build
# Every value below has a development default, so no .env file is needed. To change one, copy .env.example to .env.
# The default API key and RabbitMQ password are for local demonstration only; change them for any shared environment.
# Containers reach each other by service name (mongo, redis, rabbitmq, api); only the ports under "ports:" reach the host.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      # Loopback only. Published so the integration tests can reach the same MongoDB the API uses.
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Cache only: no persistence. volatile-lru never evicts keys without a TTL, so the cache-generation counter stays.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "volatile-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-hold}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-dev-only-rabbit-password}
    ports:
      - "127.0.0.1:${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 40s

  api:
    build:
      context: .
      dockerfile: src/InventoryHold.Api/Dockerfile
    restart: unless-stopped
    environment:
      Auth__ApiKey: ${API_KEY:-dev-only-api-key-0123456789}
      Mongo__ConnectionString: mongodb://mongo:27017
      Mongo__Database: inventory_hold
      Redis__ConnectionString: redis:6379
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-hold}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-dev-only-rabbit-password}
      Seed__Enabled: ${SEED_DEMO_DATA:-true}
      Holds__DefaultTtlMinutes: ${HOLD_DEFAULT_TTL_MINUTES:-15}
      Holds__ExpiryIntervalSeconds: ${HOLD_EXPIRY_INTERVAL_SECONDS:-15}
      Docs__OpenApi: "true"
    ports:
      - "${API_PORT:-5080}:8080"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      # The runtime image has no curl. Ask /health/ready over a raw socket: healthy means MongoDB and the bus are reachable.
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    build:
      context: ./web
    restart: unless-stopped
    environment:
      # The browser calls /api on the web container's own address; nginx forwards it to the API over the
      # compose network and adds the API key, so no internal host name ever reaches the browser.
      API_UPSTREAM: api:8080
      API_KEY: ${API_KEY:-dev-only-api-key-0123456789}
    ports:
      - "${WEB_PORT:-8081}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  mongo-data:
  rabbitmq-data:
